// ========== EXTRACT TITLE AND YEAR ==========
function extractTitleAndYear(query) {
    let title = query.trim();
    let year = '';
    
    const yearPatterns = [
        /(.+?)\s*[\(\[]?\s*(\d{4})\s*[\)\]]?\s*$/,
        /(.+?)\s+(\d{4})\s*$/,
        /(.+?)\s*[\(\[](\d{4})[\)\]]/,
    ];
    
    for (const pattern of yearPatterns) {
        const match = title.match(pattern);
        if (match) {
            title = match[1].trim();
            year = match[2];
            break;
        }
    }
    
    title = title
        .replace(/[\(\[]\d{4}[\)\]]/g, '')
        .replace(/HDRip|HDCam|HDTS|WEB-DL|BluRay|BRRip|DVDRip|HDTV|WEBRip|CAM|TS|TC|DVDSCR|HDDVD|BDRip|1080p|720p|480p|2160p|4K|HEVC|x264|x265|AAC|DD5\.1|DDP5\.1|ESub|HQ|HDRip|PreDVDRip/gi, '')
        .replace(/@\S+/g, '')
        .replace(/[^\w\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    
    return { title, year };
}

// ========== IMDb INTEGRATION ==========
async function fetchIMDbInfo(movieTitle, movieYear = '') {
    if (!movieTitle || movieTitle.trim() === '') return null;
    
    const cacheKey = `${movieTitle.toLowerCase().trim()}_${movieYear}`;
    if (imdbCache.has(cacheKey)) return imdbCache.get(cacheKey);
    
    try {
        let apiUrl = `${OMDB_API_URL}?apikey=${OMDB_API_KEY}&t=${encodeURIComponent(movieTitle.trim())}`;
        if (movieYear) apiUrl += `&y=${movieYear}`;
        apiUrl += `&plot=short`;
        
        let response = await fetch(apiUrl);
        let data = await response.json();
        
        if (data.Response === 'True') { imdbCache.set(cacheKey, data); return data; }
        
        if (movieYear) {
            response = await fetch(`${OMDB_API_URL}?apikey=${OMDB_API_KEY}&t=${encodeURIComponent(movieTitle.trim())}&plot=short`);
            data = await response.json();
            if (data.Response === 'True') { imdbCache.set(cacheKey, data); return data; }
        }
        
        let searchUrl = `${OMDB_API_URL}?apikey=${OMDB_API_KEY}&s=${encodeURIComponent(movieTitle.trim())}&type=movie`;
        if (movieYear) searchUrl += `&y=${movieYear}`;
        
        const searchResponse = await fetch(searchUrl);
        const searchData = await searchResponse.json();
        
        if (searchData.Response === 'True' && searchData.Search && searchData.Search.length > 0) {
            response = await fetch(`${OMDB_API_URL}?apikey=${OMDB_API_KEY}&i=${searchData.Search[0].imdbID}&plot=short`);
            data = await response.json();
            if (data.Response === 'True') { imdbCache.set(cacheKey, data); return data; }
        }
        
        imdbCache.set(cacheKey, null);
        return null;
    } catch (error) {
        console.error('IMDb fetch error:', error);
        return null;
    }
}

async function performSearchWithPopup(page = 1) {
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultsInfo = document.getElementById('resultsInfo');
    const paginationContainer = document.getElementById('paginationContainer');
    const imdbContainer = document.getElementById('imdbInfoContainer');
    
    let query = getValidSearchQuery();
    if (!query || query === '') {
        if (resultsContainer) resultsContainer.innerHTML = `<div class="error-state"><i class="fas fa-search fa-3x mb-3" style="color:#00ccff;"></i><h4>Enter a search term</h4><p>Example: Animal 2023, Jawan</p></div>`;
        if (resultsInfo) resultsInfo.style.display = 'none';
        if (paginationContainer) paginationContainer.innerHTML = '';
        if (imdbContainer) imdbContainer.innerHTML = '';
        return;
    }
    currentQuery = query;
    currentPage = page;
    const url = new URL(window.location);
    url.searchParams.set('query', query);
    url.searchParams.set('page', page);
    window.history.pushState({}, '', url);
    if (resultsContainer) resultsContainer.innerHTML = `<div class="results-loading"><div class="spinner"></div><p style="color:#00ccff;">Searching for "${escapeHtml(query)}"...</p></div>`;
    if (resultsInfo) resultsInfo.style.display = 'none';
    if (paginationContainer) paginationContainer.innerHTML = '';
    loadIMDbInfo(query);
    const cacheKey = `${query}-${page}`;
    if (searchCache.has(cacheKey)) { const cached = searchCache.get(cacheKey); renderResults(cached.results, cached.pagination); return; }
    try {
        const data = await fetchAPI(query, page);
        if (data && data.results && data.results.length > 0) { searchCache.set(cacheKey, { results: data.results, pagination: data.pagination }); renderResults(data.results, data.pagination); }
        else if (data && data.results && data.results.length === 0) { if (resultsContainer) resultsContainer.innerHTML = `<div class="error-state"><i class="fas fa-search fa-3x mb-3" style="color:#00ccff;"></i><h4>No results found</h4><p>Try different keywords or check spelling</p></div>`; if (resultsInfo) resultsInfo.style.display = 'none'; }
        else { if (resultsContainer) resultsContainer.innerHTML = `<div class="error-state"><i class="fas fa-exclamation-triangle fa-3x mb-3" style="color:#ff6b6b;"></i><h4>Connection Error</h4><p>Unable to connect to server. Please try again.</p><button onclick="performSearchWithPopup(${page})" style="background:#00ccff;border:none;padding:10px 25px;border-radius:4px;color:#000;font-weight:600;margin-top:10px;cursor:pointer;font-family:'Josefin Sans',sans-serif;"><i class="fas fa-redo"></i> Retry</button></div>`; if (resultsInfo) resultsInfo.style.display = 'none'; }
    } catch (error) { console.error('Search error:', error); if (resultsContainer) resultsContainer.innerHTML = `<div class="error-state"><i class="fas fa-exclamation-triangle fa-3x mb-3" style="color:#ff6b6b;"></i><h4>Something went wrong</h4><p>Please try again later.</p></div>`; if (resultsInfo) resultsInfo.style.display = 'none'; }
}

async function fetchAPI(query, page) {
    for (let i = 0; i < API_ENDPOINTS.length; i++) {
        try {
            const encodedQuery = encodeURIComponent(query);
            const url = `${API_ENDPOINTS[i]}/api/search?query=${encodedQuery}&page=${page}&limit=${RESULTS_PER_PAGE}`;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(timeout);
            if (response.ok) { const data = await response.json(); if (data.status === 'success') return data; }
        } catch (e) { console.error('API Error:', e); continue; }
    }
    return null;
}

function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
function formatSize(bytes) { if (!bytes || bytes === 0) return '0 B'; const k = 1024; const sizes = ['B','KB','MB','GB']; const i = Math.floor(Math.log(bytes)/Math.log(k)); return parseFloat((bytes/Math.pow(k,i)).toFixed(2))+' '+sizes[i]; }
function formatTitle(title) { if (!title) return ''; let formatted = escapeHtml(title); formatted = formatted.replace(/@(?!sk4film\b)([a-zA-Z0-9_]+)/g, '<a href="https://t.me/sk4film" target="_blank" rel="noopener noreferrer" style="color:#00ccff;text-decoration:underline;font-weight:600;">@sk4film</a>'); formatted = formatted.replace(/@sk4film\b/g, '<a href="https://t.me/sk4film" target="_blank" rel="noopener noreferrer" style="color:#00ccff;text-decoration:underline;font-weight:600;">@sk4film</a>'); return formatted; }

function formatPostContent(content) {
    if (!content) return '';
    let formatted = escapeHtml(content).replace(/\n/g, '<br>');
    formatted = formatted.replace(/(?:https?:\/\/)?(?:www\.)?(t\.me|telegram\.me|telegram\.dog)\/([a-zA-Z0-9_]+)(?:\/(\d+))?/g, '<a href="https://t.me/sk4film" target="_blank" rel="noopener noreferrer" style="color:#00ccff;text-decoration:underline;">https://t.me/sk4film</a>');
    formatted = formatted.replace(/@(?!sk4film\b)([a-zA-Z0-9_]+)/g, '<a href="https://t.me/sk4film" target="_blank" rel="noopener noreferrer" style="color:#00ccff;text-decoration:underline;font-weight:600;">@sk4film</a>');
    formatted = formatted.replace(/@sk4film\b/g, '<a href="https://t.me/sk4film" target="_blank" rel="noopener noreferrer" style="color:#00ccff;text-decoration:underline;font-weight:600;">@sk4film</a>');
    formatted = formatted.replace(/(https?:\/\/[^\s<]+)(?![^<]*>|[^<>]*<\/)/g, '<a href="$&" target="_blank" rel="noopener noreferrer" style="color:#00ccff;text-decoration:underline;">$&</a>');
    return formatted;
}

function createPostContent(content, index) {
    if (!content || !content.trim()) return '';
    const isLong = content.length > 1200;
    let html = `<div class="result-post-content" id="post-content-${index}" style="position:relative;"><div class="post-text" style="max-height:${isLong?'150px':'none'};overflow:hidden;">${formatPostContent(content)}</div>`;
    if (isLong) html += `<div class="fade-effect" style="position:absolute;bottom:40px;left:0;right:0;height:40px;background:linear-gradient(transparent,#0a0a0a);pointer-events:none;"></div><button class="show-more-btn" onclick="togglePostContent(${index})" id="post-toggle-${index}"><i class="fas fa-chevron-down"></i> Show More ↓</button>`;
    html += `</div>`;
    return html;
}

function togglePostContent(index) {
    const contentDiv = document.getElementById(`post-content-${index}`);
    if (!contentDiv) return;
    const toggleBtn = document.getElementById(`post-toggle-${index}`);
    const textDiv = contentDiv.querySelector('.post-text');
    const fadeEffect = contentDiv.querySelector('.fade-effect');
    if (textDiv.style.maxHeight === 'none') { textDiv.style.maxHeight = '150px'; if (fadeEffect) fadeEffect.style.display = 'block'; if (toggleBtn) toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Show More ↓'; }
    else { textDiv.style.maxHeight = 'none'; if (fadeEffect) fadeEffect.style.display = 'none'; if (toggleBtn) toggleBtn.innerHTML = '<i class="fas fa-chevron-up"></i> Show Less ↑'; }
}

// ========== DOWNLOAD quality options (Telegram bot links) ==========
function generateQualityOptions(qualityOptions, result) {
    if (!qualityOptions || typeof qualityOptions !== 'object') return '<p style="color:#999;margin:0;">No options available</p>';
    let html = '<div style="display:flex;flex-wrap:wrap;gap:8px;">'; let count = 0;
    let defaultMsgId = result.real_message_id || result.message_id || result.id || '0';
    defaultMsgId = String(defaultMsgId).replace(/\D/g, '');
    for (const [quality, data] of Object.entries(qualityOptions)) {
        if (data && typeof data === 'object') {
            let qualityMsgId = data.message_id || defaultMsgId;
            qualityMsgId = String(qualityMsgId).replace(/\D/g, '');
            if (qualityMsgId && qualityMsgId !== '0') {
                const fileId = `${FILE_CHANNEL_ID}_${qualityMsgId}_${quality.toLowerCase().replace(/\s+/g,'_')}`;
                const size = data.file_size ? formatSize(data.file_size) : '';
                const telegramLink = `https://t.me/${BOT_USERNAME}?start=${fileId}`;
                const badge = !hasUserSeenRedirect ? '<span class="one-time-badge">NEW</span>' : '';
                html += `<button class="quality-option-2click quality-option-download" onclick="handleQualityClick('${telegramLink}')">${quality} ${size} ${badge}</button>`;
                count++;
            }
        }
    }
    if (count === 0) { const badge = !hasUserSeenRedirect ? '<span class="one-time-badge">NEW</span>' : ''; html += `<button class="quality-option-2click quality-option-download" onclick="handleQualityClick('https://t.me/${BOT_USERNAME}')">Get from Bot ${badge}</button>`; }
    html += '</div>'; return html;
}

// ========== 🆕 WATCH quality options (opens view.html player directly, no Telegram redirect) ==========
function generateWatchQualityOptions(qualityOptions, result) {
    if (!qualityOptions || typeof qualityOptions !== 'object') return '<p style="color:#999;margin:0;">No options available</p>';
    let html = '<div style="display:flex;flex-wrap:wrap;gap:8px;">'; let count = 0;
    let defaultMsgId = result.real_message_id || result.message_id || result.id || '0';
    defaultMsgId = String(defaultMsgId).replace(/\D/g, '');
    for (const [quality, data] of Object.entries(qualityOptions)) {
        if (data && typeof data === 'object') {
            let qualityMsgId = data.message_id || defaultMsgId;
            qualityMsgId = String(qualityMsgId).replace(/\D/g, '');
            if (qualityMsgId && qualityMsgId !== '0') {
                const size = data.file_size ? formatSize(data.file_size) : '';
                const watchLink = `view.html?channel_id=${FILE_CHANNEL_ID}&message_id=${qualityMsgId}`;
                html += `<a href="${watchLink}" target="_blank" rel="noopener noreferrer" class="quality-option-2click quality-option-watch" style="text-decoration:none;">${quality} ${size}</a>`;
                count++;
            }
        }
    }
    if (count === 0) {
        const watchLink = `view.html?channel_id=${FILE_CHANNEL_ID}&message_id=${defaultMsgId}`;
        html += `<a href="${watchLink}" target="_blank" rel="noopener noreferrer" class="quality-option-2click quality-option-watch" style="text-decoration:none;">Watch</a>`;
    }
    html += '</div>'; return html;
}

function handleQualityClick(telegramLink) {
    triggerBackgroundSmartlink();
    if (hasUserSeenRedirect) { window.open(telegramLink, '_blank'); return; }
    localStorage.setItem(REDIRECT_KEY, 'true'); hasUserSeenRedirect = true;
    pendingTelegramLink = telegramLink; redirectCountdown = 3;
    const rt = document.getElementById('redirectTimer'), rs = document.getElementById('redirectSeconds'), rpb = document.getElementById('redirectProgressBar'), ro = document.getElementById('redirectOverlay');
    if (rt) rt.textContent = redirectCountdown; if (rs) rs.textContent = redirectCountdown; if (rpb) rpb.style.width = '0%'; if (ro) ro.classList.add('active');
    setTimeout(() => { if (rpb) rpb.style.width = '100%'; }, 50);
    if (redirectTimeout) clearInterval(redirectTimeout);
    redirectTimeout = setInterval(() => { redirectCountdown--; if (rt) rt.textContent = redirectCountdown; if (rs) rs.textContent = redirectCountdown; if (redirectCountdown <= 0) { clearInterval(redirectTimeout); redirectTimeout = null; window.open(pendingTelegramLink, '_blank'); closeRedirect(); } }, 1000);
}

function triggerAdLink() { triggerBackgroundSmartlink(); }

// 🆕 Generic toggle used by both Watch and Download quality dropdowns —
// closes any other open dropdown so only one shows at a time.
function toggleQualityDropdown(id) {
    const dropdown = document.getElementById(id);
    if (!dropdown) return;
    const isOpen = dropdown.style.display === 'block';
    document.querySelectorAll('.quality-dropdown').forEach(d => { d.style.display = 'none'; });
    dropdown.style.display = isOpen ? 'none' : 'block';
}
function toggleDownload(index) { toggleQualityDropdown(`download-quality-${index}`); }
function toggleWatch(index) { toggleQualityDropdown(`watch-quality-${index}`); }

function renderResults(results, pagination) {
    const rc = document.getElementById('resultsContainer'), ri = document.getElementById('resultsInfo'), pc = document.getElementById('paginationContainer');
    if (!rc) return;
    if (!results || results.length === 0) { rc.innerHTML = `<div class="error-state" style="text-align:center;padding:40px;"><i class="fas fa-search fa-3x mb-3" style="color:#00ccff;"></i><h4>No results found</h4><p>Try different keywords</p></div>`; if (ri) ri.style.display = 'none'; if (pc) pc.innerHTML = ''; return; }
    if (ri && pagination) { ri.innerHTML = `Found <strong>${pagination.total_results}</strong> results · Page ${pagination.current_page} of ${pagination.total_pages}`; ri.style.display = 'block'; }
    let html = '';
    results.forEach((result, index) => {
        const title = result.title || 'Untitled', thumbUrl = result.thumbnail_url || result.poster_url || FALLBACK_THUMBNAIL;
        const hasFile = result.has_file === true, qualityOptions = result.qualities || result.quality_options || {}, hasQualities = Object.keys(qualityOptions).length > 0, postContent = result.post_content || result.content || '';
        let msgIdForStream = result.real_message_id || result.message_id || result.id || '0';
        msgIdForStream = String(msgIdForStream).replace(/\D/g, '');
        if ((msgIdForStream === '0' || msgIdForStream === '') && hasQualities) { const fq = Object.values(qualityOptions)[0]; if (fq && fq.message_id) msgIdForStream = String(fq.message_id).replace(/\D/g, ''); }
        const streamLink = `view.html?channel_id=${FILE_CHANNEL_ID}&message_id=${msgIdForStream}`;
        html += `<div class="result-card"><div class="result-thumbnail-top"><div class="thumbnail-container" onclick="triggerAdLink()"><img src="${thumbUrl}" alt="${escapeHtml(title)}" loading="lazy" onerror="this.src='${FALLBACK_THUMBNAIL}'"><div class="play-overlay"><div class="play-button"><i class="fas fa-play"></i></div></div>${hasFile?'<div class="video-file-badge">SK4FiLM</div>':''}</div></div><h3 class="result-title">${formatTitle(title)}</h3>`;
        if (postContent && postContent.trim().length > 0) html += createPostContent(postContent, index);
        if (hasFile) {
            if (hasQualities) {
                // 🆕 Each button's dropdown sits directly under that same button
                html += `<div class="action-buttons-container">
                    <div class="action-btn-wrap">
                        <button class="btn-stream-now" onclick="toggleWatch(${index})"><i class="fas fa-play-circle"></i> Watch Now <i class="fas fa-chevron-down ms-1"></i></button>
                        <div class="quality-dropdown" id="watch-quality-${index}" style="display:none;">${generateWatchQualityOptions(qualityOptions, result)}</div>
                    </div>
                    <div class="action-btn-wrap">
                        <button class="btn-download-main" onclick="toggleDownload(${index})"><i class="fas fa-download"></i>Download <i class="fas fa-chevron-down ms-1"></i></button>
                        <div class="quality-dropdown" id="download-quality-${index}" style="display:none;">${generateQualityOptions(qualityOptions, result)}</div>
                    </div>
                </div>`;
            } else {
                html += `<div class="action-buttons-container"><a href="${streamLink}" target="_blank" rel="noopener noreferrer" class="btn-stream-now"><i class="fas fa-play-circle"></i> Watch Now</a>`;
                const dl = `https://t.me/${BOT_USERNAME}?start=${FILE_CHANNEL_ID}_${msgIdForStream}`; const badge = !hasUserSeenRedirect ? '<span class="one-time-badge">1st time</span>' : ''; html += `<button class="btn-download-main" onclick="handleQualityClick('${dl}')"><i class="fas fa-download"></i>Download ${badge}</button></div>`;
            }
        } else { html += `<div class="action-buttons-container"><a href="https://sk4film.vercel.app/view.html" target="_blank" rel="noopener noreferrer" class="btn-stream-now"><i class="fas fa-play-circle"></i> Watch Live Cricket</a></div>`; }
        html += `</div>`;
    });
    rc.innerHTML = html;
    if (pagination && pagination.total_pages > 1) renderPagination(pagination); else if (pc) pc.innerHTML = '';
}

function renderPagination(pag) {
    const pc = document.getElementById('paginationContainer'); if (!pc) return;
    let p = '<nav><ul style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px;list-style:none;padding:0;margin:20px 0;">';
    p += `<li><a class="page-link ${!pag.has_previous?'disabled':''}" href="#" onclick="${pag.has_previous?`changePage(${pag.current_page-1});return false;`:'return false;'}">«</a></li>`;
    for (let i = 1; i <= pag.total_pages; i++) { if (i===1||i===pag.total_pages||(i>=pag.current_page-2&&i<=pag.current_page+2)) p += `<li class="page-item ${i===pag.current_page?'active':''}"><a class="page-link" href="#" onclick="changePage(${i});return false;">${i}</a></li>`; else if (i===pag.current_page-3||i===pag.current_page+3) p += '<li><span style="padding:8px 12px;color:rgba(255,255,255,0.3);">…</span></li>'; }
    p += `<li><a class="page-link ${!pag.has_next?'disabled':''}" href="#" onclick="${pag.has_next?`changePage(${pag.current_page+1});return false;`:'return false;'}">»</a></li>`;
    p += '</ul></nav>'; pc.innerHTML = p;
}

window.changePage = function(page) { if (page > 0) { performSearchWithPopup(page); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
function closeRedirect() { if (redirectTimeout) { clearInterval(redirectTimeout); redirectTimeout = null; } const ro = document.getElementById('redirectOverlay'); if (ro) ro.classList.remove('active'); pendingTelegramLink = ''; }

// Event Listeners
const searchButton = document.getElementById('searchButton'), searchInput = document.getElementById('searchInput');
if (searchButton) { searchButton.addEventListener('click', e => { e.preventDefault(); performSearchWithPopup(1); }); searchButton.addEventListener('touchend', e => { e.preventDefault(); performSearchWithPopup(1); }); }
if (searchInput) { searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); performSearchWithPopup(1); } }); searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') { searchInput.value = ''; searchInput.blur(); } }); }
window.addEventListener('load', () => { const params = new URLSearchParams(window.location.search), query = params.get('query'), page = parseInt(params.get('page')) || 1; if (query && searchInput) { searchInput.value = query; performSearchWithPopup(page); } });
window.addEventListener('popstate', () => { const params = new URLSearchParams(window.location.search), query = params.get('query'), page = parseInt(params.get('page')) || 1; if (query && searchInput) { searchInput.value = query; performSearchWithPopup(page); } });
document.addEventListener('click', event => { if (!event.target.closest('.action-buttons-container') && !event.target.closest('.quality-dropdown')) document.querySelectorAll('.quality-dropdown').forEach(d => d.style.display = 'none'); });

window.triggerAdLink = triggerAdLink;
window.toggleDownload = toggleDownload;
window.toggleWatch = toggleWatch;
window.handleQualityClick = handleQualityClick;
window.closeRedirect = closeRedirect;
window.togglePostContent = togglePostContent;
window.performSearchWithPopup = performSearchWithPopup;
window.toggleMenu = toggleMenu;
</script>
