    <style>
        :root {
            --primary-red: #e50914;
            --primary-blue: #0066ff;
            --accent: #00ccff;
            --dark-bg: #0a0a0f;
            --plyr-color-main: #e50914;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: var(--dark-bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-top: 60px;
        }
        
        /* ============ NAVIGATION (Mobile-Friendly) ============ */
        .top-navbar {
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(15px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
            padding: 8px 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.3);
        }
        
        .navbar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 10px;
        }
        
        .logo-section {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            min-width: 0;
        }
        
        .logo-img {
            height: 35px;
            width: 35px;
            margin-right: 6px;
            border-radius: 8px;
            object-fit: contain;
        }
        
        .brand-text {
            font-size: 1.1rem;
            background: linear-gradient(90deg, var(--primary-red), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .brand-subtitle {
            display: none;
        }
        
        .menu-button {
            background: rgba(0, 204, 255, 0.15);
            border: 2px solid var(--accent);
            color: var(--accent);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        
        .menu-lines {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .menu-line {
            width: 18px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .menu-dropdown {
            position: fixed;
            top: 55px;
            right: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.98);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 15px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 998;
        }
        
        .menu-dropdown.active {
            max-height: 300px;
            opacity: 1;
        }
        
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .menu-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(0, 204, 255, 0.1);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        /* ============ PLAYER ============ */
        .player-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }
        
        .plyr {
            --plyr-color-main: #e50914;
            --plyr-video-control-color: #fff;
            --plyr-video-control-color-hover: #fff;
            --plyr-video-control-background-hover: rgba(229, 9, 20, .8);
            --plyr-range-fill-background: #e50914;
            --plyr-menu-background: #181818;
            --plyr-menu-color: #fff;
            border-radius: 0;
            overflow: hidden;
        }
        
        .plyr video {
            width: 100%;
            height: auto;
            background: #000;
        }
        
        .plyr--video .plyr__control--overlaid {
            background: linear-gradient(135deg, var(--primary-red), var(--primary-blue));
            border: 2px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            padding: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .custom-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            pointer-events: none;
        }
        
        .custom-loading.active {
            display: flex;
        }
        
        .loading-spinner-ring {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary-red);
            border-right: 4px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            color: #fff;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* ============ CONTENT ============ */
        .content-section {
            padding: 10px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .video-info {
            text-align: center;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        
        .video-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .video-badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .badge-red { background: var(--primary-red); color: white; }
        .badge-blue { background: var(--primary-blue); color: white; }
        .badge-green { background: #28a745; color: white; }
        
        /* ============ SEARCH (Below Video Title) ============ */
        .search-section {
            margin: 10px 0;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(0, 204, 255, 0.3);
        }
        
        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        
        .search-input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--accent);
            font-size: 0.9rem;
            pointer-events: none;
        }
        
        .search-input {
            width: 100%;
            background: rgba(60, 65, 90, 0.9);
            border: 2px solid var(--accent);
            color: white;
            padding: 10px 35px 10px 35px;
            font-size: 0.9rem;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
            border-color: #00e6ff;
        }
        
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .search-clear-btn {
            position: absolute;
            right: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        
        .search-clear-btn.show {
            display: flex;
        }
        
        /* Live Search Results */
        .live-search-results {
            margin-top: 10px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
        }
        
        .live-search-results.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        
        .search-result-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
        }
        
        .search-result-icon {
            font-size: 1.5rem;
            width: 35px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .search-result-info {
            flex: 1;
            min-width: 0;
        }
        
        .search-result-name {
            font-weight: 600;
            color: #fff;
            font-size: 0.85rem;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .search-result-meta {
            font-size: 0.7rem;
            color: #aaa;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .search-result-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        
        .btn-play-mini {
            background: linear-gradient(45deg, var(--primary-red), var(--primary-blue));
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn-play-mini:hover {
            transform: scale(1.1);
            box-shadow: 0 3px 10px rgba(255, 0, 0, 0.4);
        }
        
        .btn-download-mini {
            background: rgba(0, 204, 255, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .btn-download-mini:hover {
            background: rgba(0, 204, 255, 0.25);
            transform: scale(1.1);
        }
        
        .btn-see-more {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            margin-top: 5px;
            display: none;
        }
        
        .btn-see-more.show {
            display: block;
        }
        
        .btn-see-more:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .search-loading {
            text-align: center;
            padding: 15px;
            color: #aaa;
            font-size: 0.85rem;
        }
        
        .search-empty {
            text-align: center;
            padding: 15px;
            color: #aaa;
            font-size: 0.85rem;
        }
        
        /* ============ CATEGORY ============ */
        .category-section {
            margin: 15px 0;
        }
        
        .category-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 4px solid var(--primary-red);
            color: #fff;
        }
        
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .channel-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 10px;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }
        
        .channel-card:active {
            transform: scale(0.95);
        }
        
        .channel-logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 5px;
            border: 2px solid var(--primary-red);
            background: white;
        }
        
        .channel-name {
            font-size: 0.7rem;
            font-weight: 600;
            text-align: center;
            color: #fff;
            line-height: 1.2;
        }
        
        .donation-card {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .donation-qr {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            margin: 0 auto 15px;
            border: 2px solid rgba(255, 193, 7, 0.3);
            background: white;
            padding: 8px;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 10000;
            font-size: 0.85rem;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,0,0,0.3);
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0%); opacity: 1; }
        }
        
        /* External Player Modal */
        .external-player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .external-player-modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* ============ TABLET & DESKTOP ============ */
        @media (min-width: 768px) {
            body {
                padding-top: 70px;
            }
            
            .brand-subtitle {
                display: block;
                font-size: 0.6rem;
                color: var(--accent);
                font-style: italic;
            }
            
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            
            .channel-logo {
                width: 70px;
                height: 70px;
            }
            
            .channel-name {
                font-size: 0.8rem;
            }
            
            .video-title {
                font-size: 1.3rem;
            }
            
            .search-result-item {
                padding: 12px;
            }
            
            .search-result-name {
                font-size: 0.95rem;
            }
        }
        
        @media (min-width: 992px) {
            .content-section {
                padding: 15px;
            }
            
            .search-result-actions {
                gap: 8px;
            }
            
            .btn-play-mini, .btn-download-mini {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }
    </style>
    <style>
        #floating_ads_container {position: fixed;bottom: 2px;width: 100%; -webkit-transition: width 1s, height 1s; transition: width 1s, height 1s;z-index:999;} 
        #floating_ads_wrap {text-align: center;} 
        #floating_ads_bottom_ad {display:inline-block;position:relative}

    </style> 
</head>

    <!-- External Player Modal -->
    <div class="external-player-modal" id="externalPlayerModal">

            <button onclick="closeExternalModal()" style="position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;">

    <div class="container-fluid px-0">

        <!-- Content Section -->
        <div class="content-section">
            <!-- Video Info -->
            <div class="video-info">
                <div class="video-title" id="videoTitle">SK4FiLM Live Stream</div>
                <div class="video-badges">
                    <span class="badge badge-red"><i class="fas fa-file me-1"></i> Live</span>
                    <span class="badge badge-blue"><i class="fas fa-wifi me-1"></i> Direct</span>

                </div>

            <!-- ================= SEARCH SECTION (Below Video Title) ================= -->

                        <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()">

                        </button>
                    </div>
                </div>
                
                <!-- Live Search Results -->
                <div class="live-search-results" id="liveSearchResults"></div>
            </div>
            
            <!-- Sports Category -->

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

    <script>
        // ============ CONFIGURATION ============
        const API_BASE = 'https://uninterested-drusie-tgbottest-65971677.koyeb.app';
        const SEARCH_ENDPOINT = API_BASE + '/api/search';
        const STREAM_BASE = API_BASE + '/stream';
        
        let player = null;
        let hls = null;
        let currentChannelUrl = '';
        let currentChannelName = '';
        let searchDebounceTimer = null;
        let allSearchResults = [];
        let showingAllResults = false;
        
        const DEFAULT_STREAM = 'https://cdn-2.pishow.tv/live/1461/master.m3u8';
        
        // ============ PLYR INIT ============
        function initializePlayer() {
            player = new Plyr("#player", {
                controls: ["play-large", "rewind", "play", "fast-forward", "progress", 
                          "current-time", "duration", "mute", "volume", "settings", 
                          "pip", "airplay", "fullscreen"],
                seekTime: 10,
                settings: ["quality", "speed"],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
                keyboard: { focused: true, global: true },
                tooltips: { controls: true, seek: true },
                hideControls: true,
                resetOnEnd: false,
                clickToPlay: true,
                volume: 1,
                muted: false
            });
            
            player.on("ready", () => {
                console.log("✅ Player Ready");
                loadStream(DEFAULT_STREAM);
            });
            
            player.on("play", () => { hideLoading(); });
            player.on("waiting", () => { showLoading(); });
            player.on("playing", () => { hideLoading(); });
            player.on("canplay", () => { hideLoading(); });
            player.on("error", () => {
                hideLoading();
                if (currentChannelName) showExternalModal(currentChannelName);
            });
        }
        
        // ============ HLS STREAM ============
        function loadStream(url) {
            const videoElement = document.querySelector('#player');
            showLoading();
            
            if (hls) { hls.destroy(); hls = null; }
            
            if (Hls.isSupported()) {
                hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 90 });
                hls.loadSource(url);
                hls.attachMedia(videoElement);
                
                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    const qualities = data.levels.map((level, index) => ({
                        label: level.height ? `${level.height}p` : `Quality ${index + 1}`,
                        value: index,
                        default: index === data.levels.length - 1
                    }));
                    if (player && player.quality) player.quality.options = qualities;
                    hideLoading();
                    videoElement.play().catch(e => { hideLoading(); });
                });
                
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                        else { hideLoading(); if (currentChannelName) showExternalModal(currentChannelName); hls.destroy(); }
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = url;
                videoElement.addEventListener('loadedmetadata', () => { hideLoading(); videoElement.play().catch(e => hideLoading()); });
            } else {
                hideLoading();
                showToast('HLS not supported', 3000);
            }
        }
        
        // ============ LOADING ============
        function showLoading() {
            const el = document.getElementById('customLoading');
            if (el) {
                el.classList.add('active');
                const text = el.querySelector('.loading-text');
                text.textContent = currentChannelName ? `Loading ${currentChannelName}...` : 'Loading...';
            }
        }
        
        function hideLoading() {
            const el = document.getElementById('customLoading');
            if (el) el.classList.remove('active');
        }
        
        // ============ CHANNELS ============
        const channelLogos = {
            'star sports Hd': 'https://i.ibb.co/ywrgTyZ/star-sports-live-cricket-matches-guide-screenshot.png',
            'star sports 1 hindi': 'https://i.ibb.co/4RFSmjvK/IMG-20260220-190309.png',
            'star sports 2 hindi': 'https://i.ibb.co/r2cVyTRr/images-1.jpg',
            'Sony Sports HD': 'https://i.ibb.co/8WvRk5k/images-2.jpg',
            'Sony Sports 2': 'https://i.ibb.co/qYSpYPw4/1390.webp',
            'Sony Sports 3': 'https://i.ibb.co/Qv8XHQqf/Ten3-HD.png',
            'Sony Max': 'https://i.ibb.co/q3CLCXFY/Sony-Max-new-logo.png',
            'Sony Pix HD': 'https://i.ibb.co/L3SFy2D/214x0-icon.png',
            'Sony Wah': 'https://i.ibb.co/d0cgFwKt/images-3.jpg',
            '&pictures HD': 'https://i.ibb.co/MDvPcjq2/And-Pictures-HD.png',
            'Colors Cineplex': 'https://i.ibb.co/TMXmZqKm/images-4.jpg',
            'Zee Action': 'https://i.ibb.co/R42DsF0H/zee-action-advertising-services-500x500.png',
            'Box Cinema': 'https://upload.wikimedia.org/wikipedia/commons/8/8e/Box_Cinema_logo.png',
            'B4U Movies': 'https://upload.wikimedia.org/wikipedia/commons/9/92/B4U_Network_logo.png',
            'Dhamaka Movies B4U': 'https://upload.wikimedia.org/wikipedia/commons/9/92/B4U_Network_logo.png',
            '9xM': 'https://upload.wikimedia.org/wikipedia/commons/5/5c/9XM_Logo.png',
            'Mastiii': 'https://upload.wikimedia.org/wikipedia/commons/4/49/Mastiii_logo.png',
            'B4U Music': 'https://upload.wikimedia.org/wikipedia/commons/9/92/B4U_Network_logo.png'
        };
        
        const channels = {
            sports: [
                { name: 'star sports Hd', url: 'http://103.229.254.25:7001/play/a0a0/index.m3u8' },
                { name: 'star sports 1 hindi', url: 'http://161.248.38.40:8000/play/a071/index.m3u8' },
                { name: 'star sports 2 hindi', url: 'http://161.248.38.40:8000/play/a06n/index.m3u8' },
                { name: 'Sony Sports HD', url: 'http://103.229.254.25:7001/play/a02t/index.m3u8' },
                { name: 'Sony Sports 2', url: 'http://103.229.254.25:7001/play/a09q/index.m3u8' },
                { name: 'Sony Sports 3', url: 'http://103.229.254.25:7001/play/a0dw/index.m3u8' }
            ],
            movies: [
                { name: 'Sony Max', url: 'https://streamer2.nexgen.bz/SONYMAX/index.m3u8' },
                { name: 'Sony Pix HD', url: 'http://103.229.254.25:7001/play/a0ed/index.m3u8' },
                { name: 'Sony Wah', url: 'http://103.78.149.54:8000/play/a01p/index.m3u8' },
                { name: '&pictures HD', url: 'http://103.229.254.25:7001/play/a033/index.m3u8' },
                { name: 'Colors Cineplex', url: 'http://103.182.170.32:8888/play/a01o' },
                { name: 'Zee Action', url: 'http://103.78.149.54:8000/play/a005/index.m3u8' },
                { name: 'Box Cinema', url: 'https://d3s7x6kmqcnb6b.cloudfront.net/d/distro001a/QK2TKFREGRYXDI8IJGHW/hls3/now,-1m/m.m3u8?ads.vf=kU8ru-Yl4zG' },
                { name: 'B4U Movies', url: 'https://amg00877-b4unew-amg00877c2-lg-in-5260.playouts.now.amagi.tv/playlist.m3u8' },
                { name: 'Dhamaka Movies B4U', url: 'https://cdn-1.pishow.tv/live/235/master.m3u8' }
            ],
            music: [
                { name: '9xM', url: 'https://b.jsrdn.com/strm/channels/9xm/master.m3u8' },
                { name: 'Mastiii', url: 'https://mumt02.tangotv.in/MASTIII/index.m3u8' },
                { name: 'B4U Music', url: 'https://cdnb4u.wiseplayout.com/B4U_Music/master.m3u8' }
            ]
        };
        
        function loadChannels() {
            document.getElementById('sports-channels').innerHTML = channels.sports.map(c => createChannelCard(c.name, c.url)).join('');
            document.getElementById('movies-channels').innerHTML = channels.movies.map(c => createChannelCard(c.name, c.url)).join('');
            document.getElementById('music-channels').innerHTML = channels.music.map(c => createChannelCard(c.name, c.url)).join('');
        }
        
        function createChannelCard(name, url) {
            const logo = channelLogos[name] || '';
            return `
                <div class="channel-card" onclick="playChannel('${name}', '${url}')">
                    <img class="channel-logo" src="${logo}" alt="${name}" 
                         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <span style="display:none;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--primary-red),var(--primary-blue));align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;color:white;margin-bottom:5px">${name.charAt(0).toUpperCase()}</span>
                    <div class="channel-name">${name}</div>
                </div>
            `;
        }
        
        function playChannel(name, url) {
            console.log(`Playing: ${name}`);
            currentChannelName = name;
            currentChannelUrl = url;
            document.getElementById('videoTitle').textContent = name;
            showLoading();
            loadStream(url);
        }
        
        // ============ LIVE SEARCH ============
        async function handleLiveSearch(query) {
            const clearBtn = document.getElementById('searchClearBtn');
            const resultsContainer = document.getElementById('liveSearchResults');
            
            clearBtn.classList.toggle('show', query.length > 0);
            
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            
            if (!query || query.trim().length === 0) {
                resultsContainer.classList.remove('active');
                resultsContainer.innerHTML = '';
                showingAllResults = false;
                return;
            }
            
            if (query.trim().length < 2) {
                resultsContainer.classList.add('active');
                resultsContainer.innerHTML = '<div class="search-empty">Type at least 2 characters...</div>';
                return;
            }
            
            resultsContainer.classList.add('active');
            resultsContainer.innerHTML = '<div class="search-loading"><div class="loading-spinner" style="margin:0 auto 8px;width:20px;height:20px;"></div>Searching...</div>';
            
            searchDebounceTimer = setTimeout(async () => {
                try {
                    const results = await searchFiles(query);
                    allSearchResults = results;
                    showingAllResults = false;
                    displaySearchResults(results, false);
                } catch (error) {
                    resultsContainer.innerHTML = '<div class="search-empty">Search failed. Try again.</div>';
                }
            }, 500);
        }
        
        function displaySearchResults(results, showAll) {
            const container = document.getElementById('liveSearchResults');
            
            if (!results || results.length === 0) {
                container.innerHTML = '<div class="search-empty">No results found</div>';
                return;
            }
            
            const displayCount = showAll ? results.length : Math.min(4, results.length);
            const displayResults = results.slice(0, displayCount);
            
            let html = `<div style="color:#aaa;font-size:0.8rem;margin-bottom:8px;">Found ${results.length} result(s)</div>`;
            
            displayResults.forEach((file) => {
                const fileSize = file.file_size ? (file.file_size / (1024 * 1024)).toFixed(1) + ' MB' : 'Unknown';
                const isVideo = (file.mime_type || '').startsWith('video/');
                const icon = isVideo ? '🎬' : '📄';
                const streamUrl = file.stream_url || `${STREAM_BASE}/${file.message_id}`;
                const downloadUrl = file.download_url || streamUrl;
                
                html += `
                    <div class="search-result-item">
                        <div class="search-result-icon">${icon}</div>
                        <div class="search-result-info">
                            <div class="search-result-name">${escapeHtml(file.file_name)}</div>
                            <div class="search-result-meta">${escapeHtml(file.mime_type || 'Unknown')} · ${fileSize}</div>
                        </div>
                        <div class="search-result-actions">
                            <button class="btn-play-mini" onclick="playSearchResult('${streamUrl}', '${escapeHtml(file.file_name)}')" title="Play">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="btn-download-mini" onclick="downloadFile('${downloadUrl}', '${escapeHtml(file.file_name)}')" title="Download">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            // See More button if more than 4 results
            if (results.length > 4 && !showAll) {
                html += `<button class="btn-see-more show" onclick="showAllResults()">
                    <i class="fas fa-chevron-down me-1"></i> See More (${results.length - 4} more)
                </button>`;
            }
            
            container.innerHTML = html;
        }
        
        function showAllResults() {
            showingAllResults = true;
            displaySearchResults(allSearchResults, true);
        }
        
        async function searchFiles(query) {
            if (!query || query.length < 2) return [];
            try {
                const url = `${SEARCH_ENDPOINT}?q=${encodeURIComponent(query)}&limit=30`;
                const response = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.results || [];
            } catch (error) {
                console.error('Search error:', error);
                throw error;
            }
        }
        
        function playSearchResult(url, name) {
            console.log(`Playing: ${name}`);
            currentChannelName = name;
            currentChannelUrl = url;
            document.getElementById('videoTitle').textContent = name;
            showLoading();
            loadStream(url);
            document.querySelector('.player-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
            showToast(`Playing: ${name}`, 2000);
            
            // Clear search
            clearSearch();
        }
        
        function downloadFile(url, name) {
            showToast(`Downloading: ${name}`, 2000);
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').classList.remove('show');
            document.getElementById('liveSearchResults').classList.remove('active');
            document.getElementById('liveSearchResults').innerHTML = '';
            allSearchResults = [];
            showingAllResults = false;
        }
        
        // ============ EXTERNAL PLAYER ============
        function showExternalModal(channelName) {
            document.getElementById('modalTitle').textContent = channelName;
            document.getElementById('externalPlayerModal').classList.add('show');
        }
        
        function closeExternalModal() {
            document.getElementById('externalPlayerModal').classList.remove('show');
        }
        
        function openWithVLC() {
            showToast("Opening VLC...", 1500);
            let url = currentChannelUrl;
            if (/Android/i.test(navigator.userAgent)) {
                window.location.href = `intent:${url}#Intent;package=org.videolan.vlc;action=android.intent.action.VIEW;type=video/*;end`;
            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                window.location.href = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(url)}`;
            } else {
                window.location.href = `vlc://${url}`;
            }
            closeExternalModal();
        }
        
        function openWithMX() {
            showToast("Opening MX Player...", 1500);
            let url = currentChannelUrl;
            if (/Android/i.test(navigator.userAgent)) {
                window.location.href = `intent:${url}#Intent;package=com.mxtech.videoplayer.ad;action=android.intent.action.VIEW;type=video/*;end`;
            } else {
                showToast("MX only on Android", 2000);
            }
            closeExternalModal();
        }
        
        // ============ UTILITY ============
        function showToast(message, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        function copyUPI() {
            const input = document.getElementById('upiId');
            input.select();
            document.execCommand('copy');
            showToast("UPI ID copied!", 2000);
        }
        
        function toggleMenu() {
            document.getElementById('menuDropdown').classList.toggle('active');
            document.getElementById('menuToggleBtn').classList.toggle('active');
        }
        
        // ============ EXPOSE ============
        window.toggleMenu = toggleMenu;
        window.handleLiveSearch = handleLiveSearch;
        window.clearSearch = clearSearch;
        window.showAllResults = showAllResults;
        window.playSearchResult = playSearchResult;
        window.downloadFile = downloadFile;
        window.playChannel = playChannel;
        window.showExternalModal = showExternalModal;
        window.closeExternalModal = closeExternalModal;
        window.openWithVLC = openWithVLC;
        window.openWithMX = openWithMX;
        window.copyUPI = copyUPI;
        
        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 Initializing...");
            initializePlayer();
            loadChannels();
            
            document.addEventListener('click', (e) => {
                const modal = document.getElementById('externalPlayerModal');
                if (e.target === modal) closeExternalModal();
                
                const menu = document.getElementById('menuDropdown');
                const menuBtn = document.getElementById('menuToggleBtn');
                if (menu.classList.contains('active') && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
                    menu.classList.remove('active');
                    menuBtn.classList.remove('active');
                }
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    clearSearch();
                    document.getElementById('menuDropdown').classList.remove('active');
                }
            });
            
            console.log("✅ Ready!");
        });
    </script>
