<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK4Film - Stream & Download</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.0/dist/feather.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* (Same CSS as before - keep all styles) */
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --primary-light: #8B83FF;
            --secondary: #FF6584;
            --bg-start: #0a0a1a;
            --bg-end: #1a1a2e;
            --card-bg: rgba(26, 26, 46, 0.92);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: rgba(108, 99, 255, 0.15);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            --gradient: linear-gradient(135deg, #6C63FF, #FF6584);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(145deg, var(--bg-start), var(--bg-end)); min-height: 100vh; color: var(--text-primary); overflow-x: hidden; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .bg-animation .circle { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(108, 99, 255, 0.08), transparent); animation: float 20s infinite ease-in-out; }
        .bg-animation .circle:nth-child(1) { width: 400px; height: 400px; top: -100px; right: -100px; animation-delay: 0s; }
        .bg-animation .circle:nth-child(2) { width: 300px; height: 300px; bottom: -50px; left: -50px; animation-delay: -7s; background: radial-gradient(circle, rgba(255, 101, 132, 0.06), transparent); }
        .bg-animation .circle:nth-child(3) { width: 200px; height: 200px; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; background: radial-gradient(circle, rgba(108, 99, 255, 0.04), transparent); }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 25% { transform: translate(30px, -30px) scale(1.05); } 50% { transform: translate(-20px, 20px) scale(0.95); } 75% { transform: translate(20px, -10px) scale(1.02); } }
        .navbar-custom { background: rgba(10, 10, 26, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-color); padding: 0.8rem 0; position: sticky; top: 0; z-index: 100; }
        .navbar-custom .brand { font-weight: 800; font-size: 1.5rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .navbar-custom .brand i { -webkit-text-fill-color: initial; color: var(--primary-light); }
        .navbar-custom .brand span { -webkit-text-fill-color: initial; color: var(--secondary); }
        .search-section { background: rgba(10, 10, 26, 0.5); border-radius: 14px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; border: 1px solid var(--border-color); }
        .search-section .form-control { background: rgba(10, 10, 26, 0.8); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 10px; padding: 0.7rem 1rem; }
        .search-section .form-control:focus { border-color: var(--primary); box-shadow: 0 0 30px rgba(108, 99, 255, 0.1); }
        .search-section .form-control::placeholder { color: var(--text-secondary); opacity: 0.6; }
        .search-results { max-height: 300px; overflow-y: auto; margin-top: 0.5rem; }
        .search-results .result-item { padding: 0.7rem 1rem; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; border-bottom: 1px solid var(--border-color); }
        .search-results .result-item:hover { background: rgba(108, 99, 255, 0.1); }
        .search-results .result-item .file-name { color: var(--text-primary); font-weight: 500; }
        .search-results .result-item .file-meta { color: var(--text-secondary); font-size: 0.8rem; }
        .search-results::-webkit-scrollbar { width: 4px; }
        .search-results::-webkit-scrollbar-track { background: rgba(10, 10, 26, 0.5); border-radius: 2px; }
        .search-results::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }
        .main-card { background: var(--card-bg); border-radius: 24px; padding: 2rem; box-shadow: var(--shadow); border: 1px solid var(--border-color); backdrop-filter: blur(20px); min-height: 450px; margin-top: 2rem; position: relative; overflow: hidden; }
        .main-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient); }
        .file-info { background: rgba(10, 10, 26, 0.5); border-radius: 14px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; border: 1px solid var(--border-color); }
        .file-info .label { color: var(--text-secondary); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .file-info .value { color: var(--text-primary); font-weight: 500; word-break: break-all; font-size: 0.95rem; }
        .file-info .value i { color: var(--primary-light); margin-right: 8px; width: 18px; }
        .file-badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .file-badge.video { background: rgba(108, 99, 255, 0.2); color: var(--primary-light); }
        .file-badge.audio { background: rgba(255, 101, 132, 0.2); color: var(--secondary); }
        .file-badge.image { background: rgba(52, 211, 153, 0.2); color: #34D399; }
        .file-badge.document { background: rgba(251, 191, 36, 0.2); color: #FBBF24; }
        .media-wrapper { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
        .media-wrapper video, .media-wrapper audio { width: 100%; height: 100%; object-fit: contain; }
        .media-wrapper audio { height: 80px; padding: 20px; background: #0a0a1a; }
        .image-wrapper { display: flex; align-items: center; justify-content: center; background: #0a0a1a; border-radius: 16px; min-height: 300px; max-height: 75vh; overflow: hidden; border: 1px solid var(--border-color); }
        .image-wrapper img { max-width: 100%; max-height: 75vh; object-fit: contain; }
        .image-wrapper img:hover { transform: scale(1.02); }
        .doc-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 2rem; background: #0a0a1a; border-radius: 16px; min-height: 250px; text-align: center; border: 1px solid var(--border-color); }
        .doc-wrapper .doc-icon { font-size: 4.5rem; color: var(--primary-light); margin-bottom: 1rem; }
        .doc-wrapper .doc-name { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); word-break: break-all; }
        .doc-wrapper .doc-size { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; }
        .btn-primary-custom { background: var(--gradient); border: none; padding: 0.7rem 2rem; font-weight: 600; border-radius: 12px; transition: all 0.3s ease; color: #fff; position: relative; overflow: hidden; }
        .btn-primary-custom::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transition: left 0.5s ease; }
        .btn-primary-custom:hover::after { left: 100%; }
        .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -8px rgba(108, 99, 255, 0.4); color: #fff; }
        .btn-outline-custom { border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.7rem 2rem; font-weight: 500; border-radius: 12px; transition: all 0.3s ease; background: transparent; }
        .btn-outline-custom:hover { background: rgba(108, 99, 255, 0.1); border-color: var(--primary); color: #fff; }
        .loading-spinner { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 350px; }
        .loading-spinner .spinner { width: 60px; height: 60px; border: 4px solid rgba(255, 255, 255, 0.05); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-spinner .loading-text { color: var(--text-secondary); margin-top: 1.5rem; font-size: 0.95rem; font-weight: 500; }
        .error-box { text-align: center; padding: 3rem 1.5rem; }
        .error-box .error-icon { font-size: 4rem; color: #ef4444; margin-bottom: 1rem; }
        .error-box .error-title { font-size: 1.4rem; font-weight: 700; color: #fca5a5; }
        .error-box .error-message { color: var(--text-secondary); margin-top: 0.5rem; }
        .toast-custom { position: fixed; bottom: 24px; right: 24px; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 24px; color: var(--text-primary); font-weight: 500; transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 9999; box-shadow: var(--shadow); font-size: 0.95rem; display: flex; align-items: center; gap: 12px; }
        .toast-custom.show { transform: translateY(0); opacity: 1; }
        .toast-custom .toast-icon { color: var(--primary-light); flex-shrink: 0; }
        @media (max-width: 768px) {
            .main-card { padding: 1rem; border-radius: 16px; margin-top: 1rem; }
            .navbar-custom .brand { font-size: 1.2rem; }
            .btn-primary-custom, .btn-outline-custom { width: 100%; text-align: center; }
            .media-wrapper { aspect-ratio: 4 / 3; }
            .file-info { padding: 0.8rem 1rem; }
            .file-info .value { font-size: 0.85rem; }
            .doc-wrapper .doc-icon { font-size: 3.5rem; }
            .toast-custom { left: 16px; right: 16px; bottom: 16px; font-size: 0.85rem; padding: 12px 16px; }
            .action-buttons { flex-direction: column; gap: 8px; }
            .search-section { padding: 0.8rem 1rem; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        .footer-text { text-align: center; color: var(--text-secondary); font-size: 0.8rem; margin-top: 2rem; opacity: 0.6; }
        .footer-text a { color: var(--primary-light); text-decoration: none; }
        .footer-text a:hover { color: var(--secondary); }
    </style>
</head>
<body>

    <div class="bg-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="https://sk4film.vercel.app" class="brand text-decoration-none">
                <i data-feather="film"></i>
                SK4<span>Film</span>
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-custom py-1 px-3" onclick="shareFile()" title="Share">
                    <i data-feather="share-2" style="width:18px;height:18px;"></i>
                </button>
                <button class="btn btn-sm btn-outline-custom py-1 px-3" onclick="copyLink()" title="Copy Link">
                    <i data-feather="link-2" style="width:18px;height:18px;"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="main-card fade-in">

            <!-- Search Section -->
            <div class="search-section">
                <div class="row g-2">
                    <div class="col-md-10">
                        <input type="text" class="form-control" id="searchInput" 
                               placeholder="🔍 Search files... (Type to search)" 
                               autocomplete="off">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary-custom w-100" onclick="searchFiles()">
                            <i data-feather="search" class="me-2"></i>Search
                        </button>
                    </div>
                </div>
                <div id="searchResults" class="search-results" style="display: none;"></div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="loading-spinner">
                <div class="spinner"></div>
                <div class="loading-text">Loading file...</div>
                <small style="color:var(--text-secondary);opacity:0.5;margin-top:4px;">Please wait</small>
            </div>

            <!-- Error State -->
            <div id="errorState" class="error-box" style="display: none;">
                <div class="error-icon" data-feather="alert-circle"></div>
                <div class="error-title">Oops! Something went wrong</div>
                <p class="error-message" id="errorMessage">Unable to load file.</p>
                <button class="btn btn-primary-custom mt-3" onclick="location.reload()">
                    <i data-feather="refresh-ccw" class="me-2"></i>Try Again
                </button>
                <button class="btn btn-outline-custom mt-2" onclick="goBack()">
                    <i data-feather="arrow-left" class="me-2"></i>Go Back
                </button>
            </div>

            <!-- Content State -->
            <div id="contentState" style="display: none;">

                <div class="file-info fade-in">
                    <div class="row g-2 align-items-center">
                        <div class="col-md-6">
                            <div class="label">File Name</div>
                            <div class="value"><i data-feather="file-text"></i><span id="fileName">-</span></div>
                        </div>
                        <div class="col-md-3">
                            <div class="label">File Size</div>
                            <div class="value"><i data-feather="hard-drive"></i><span id="fileSize">-</span></div>
                        </div>
                        <div class="col-md-3 text-md-end">
                            <span class="file-badge" id="fileBadge">Unknown</span>
                        </div>
                    </div>
                </div>

                <div id="playerContainer">
                    <div id="videoPlayer" class="media-wrapper" style="display: none;">
                        <video id="videoElement" controls autoplay playsinline></video>
                    </div>
                    <div id="audioPlayer" class="media-wrapper" style="display: none;">
                        <audio id="audioElement" controls autoplay></audio>
                    </div>
                    <div id="imagePlayer" class="image-wrapper" style="display: none;">
                        <img id="imageElement" src="" alt="Image">
                    </div>
                    <div id="documentPlayer" class="doc-wrapper" style="display: none;">
                        <div class="doc-icon" data-feather="file"></div>
                        <div class="doc-name" id="docName">Document</div>
                        <div class="doc-size" id="docSize">-</div>
                        <button class="btn btn-primary-custom mt-3" id="downloadDocBtn">
                            <i data-feather="download" class="me-2"></i>Download
                        </button>
                    </div>
                    <div id="unsupportedPlayer" class="doc-wrapper" style="display: none;">
                        <div class="doc-icon" data-feather="file-question"></div>
                        <div class="doc-name">Unsupported File Type</div>
                        <div class="doc-size">Download the file to view</div>
                        <button class="btn btn-primary-custom mt-3" id="downloadUnsupportedBtn">
                            <i data-feather="download" class="me-2"></i>Download File
                        </button>
                    </div>
                </div>

                <div class="mt-4 d-flex flex-wrap gap-2 justify-content-center action-buttons">
                    <button class="btn btn-primary-custom" id="downloadBtn">
                        <i data-feather="download" class="me-2"></i>Download
                    </button>
                    <button class="btn btn-outline-custom" onclick="copyLink()">
                        <i data-feather="copy" class="me-2"></i>Copy Link
                    </button>
                    <button class="btn btn-outline-custom" onclick="shareFile()">
                        <i data-feather="share-2" class="me-2"></i>Share
                    </button>
                    <button class="btn btn-outline-custom" onclick="openExternal()">
                        <i data-feather="external-link" class="me-2"></i>Open
                    </button>
                </div>

            </div>

        </div>

        <div class="footer-text">
            Powered by <a href="https://sk4film.vercel.app">SK4Film</a> &bull; Stream &amp; Download
        </div>
    </div>

    <div id="toast" class="toast-custom">
        <span class="toast-icon" data-feather="check-circle"></span>
        <span id="toastMessage">Copied to clipboard!</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            // ✅ Koyeb URL - REPLACE WITH YOUR ACTUAL KOYEB URL
            apiUrl: 'https://your-app-name.koyeb.app',
            
            videoExtensions: ['mp4', 'mkv', 'webm', 'avi', 'mov', 'wmv', 'flv', '3gp', 'm4v', 'mpg', 'mpeg'],
            audioExtensions: ['mp3', 'wav', 'ogg', 'aac', 'flac', 'm4a', 'wma', 'opus'],
            imageExtensions: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico', 'tiff', 'tif'],
            documentExtensions: ['pdf', 'doc', 'docx', 'txt', 'rtf', 'xls', 'xlsx', 'ppt', 'pptx', 'zip', 'rar', '7z', 'tar', 'gz', 'epub', 'mobi', 'apk', 'csv']
        };

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const $ = (id) => document.getElementById(id);
        const elements = {
            loading: $('loadingState'),
            error: $('errorState'),
            errorMessage: $('errorMessage'),
            content: $('contentState'),
            fileName: $('fileName'),
            fileSize: $('fileSize'),
            fileBadge: $('fileBadge'),
            videoPlayer: $('videoPlayer'),
            videoElement: $('videoElement'),
            audioPlayer: $('audioPlayer'),
            audioElement: $('audioElement'),
            imagePlayer: $('imagePlayer'),
            imageElement: $('imageElement'),
            documentPlayer: $('documentPlayer'),
            docName: $('docName'),
            docSize: $('docSize'),
            unsupportedPlayer: $('unsupportedPlayer'),
            downloadBtn: $('downloadBtn'),
            downloadDocBtn: $('downloadDocBtn'),
            downloadUnsupportedBtn: $('downloadUnsupportedBtn'),
            searchInput: $('searchInput'),
            searchResults: $('searchResults'),
            toast: $('toast'),
            toastMessage: $('toastMessage')
        };

        // ============================================
        // TOAST SYSTEM
        // ============================================
        let toastTimeout = null;

        function showToast(message, icon = 'check-circle') {
            elements.toastMessage.textContent = message;
            elements.toast.querySelector('.toast-icon').setAttribute('data-feather', icon);
            feather.replace();
            clearTimeout(toastTimeout);
            elements.toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                elements.toast.classList.remove('show');
            }, 3000);
        }

        // ============================================
        // URL HELPERS
        // ============================================
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                fileUrl: params.get('file_url'),
                fileName: params.get('file_name'),
                fileSize: params.get('file_size'),
                channelId: params.get('channel_id'),
                messageId: params.get('message_id'),
                query: params.get('q')
            };
        }

        function getFileExtension(url, name) {
            const filename = name || url.split('/').pop().split('?')[0];
            const ext = filename.split('.').pop().toLowerCase();
            return ext;
        }

        function getFileType(extension) {
            if (CONFIG.videoExtensions.includes(extension)) return 'video';
            if (CONFIG.audioExtensions.includes(extension)) return 'audio';
            if (CONFIG.imageExtensions.includes(extension)) return 'image';
            if (CONFIG.documentExtensions.includes(extension)) return 'document';
            return 'unsupported';
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return parseFloat((bytes / Math.pow(1024, i)).toFixed(2)) + ' ' + units[i];
        }

        function getFileNameFromUrl(url) {
            try {
                const parts = url.split('/');
                let name = parts[parts.length - 1].split('?')[0];
                if (!name || name === '') name = 'file';
                return decodeURIComponent(name);
            } catch {
                return 'file';
            }
        }

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch {
                return false;
            }
        }

        function goBack() {
            window.history.back();
        }

        // ============================================
        // STATE MANAGEMENT
        // ============================================
        let currentFile = {
            url: '',
            name: '',
            size: 0,
            type: '',
            extension: '',
            channelId: '',
            messageId: ''
        };

        let searchTimeout = null;

        function showLoading() {
            elements.loading.style.display = 'flex';
            elements.error.style.display = 'none';
            elements.content.style.display = 'none';
        }

        function showError(message) {
            elements.loading.style.display = 'none';
            elements.error.style.display = 'block';
            elements.content.style.display = 'none';
            elements.errorMessage.textContent = message;
        }

        function showContent() {
            elements.loading.style.display = 'none';
            elements.error.style.display = 'none';
            elements.content.style.display = 'block';
        }

        // ============================================
        // PLAYER CONTROLS
        // ============================================
        function hideAllPlayers() {
            elements.videoPlayer.style.display = 'none';
            elements.audioPlayer.style.display = 'none';
            elements.imagePlayer.style.display = 'none';
            elements.documentPlayer.style.display = 'none';
            elements.unsupportedPlayer.style.display = 'none';
            elements.videoElement.pause();
            elements.audioElement.pause();
        }

        function showVideoPlayer(url) {
            hideAllPlayers();
            elements.videoPlayer.style.display = 'flex';
            elements.videoElement.src = url;
            elements.videoElement.load();
        }

        function showAudioPlayer(url) {
            hideAllPlayers();
            elements.audioPlayer.style.display = 'flex';
            elements.audioElement.src = url;
            elements.audioElement.load();
        }

        function showImagePlayer(url, name) {
            hideAllPlayers();
            elements.imagePlayer.style.display = 'flex';
            elements.imageElement.src = url;
            elements.imageElement.alt = name || 'Image';
        }

        function showDocumentPlayer(name, size) {
            hideAllPlayers();
            elements.documentPlayer.style.display = 'flex';
            elements.docName.textContent = name || 'Document';
            elements.docSize.textContent = formatFileSize(size) || 'Unknown size';
        }

        function showUnsupportedPlayer(name) {
            hideAllPlayers();
            elements.unsupportedPlayer.style.display = 'flex';
            elements.unsupportedPlayer.querySelector('.doc-name').textContent = name || 'Unsupported file';
        }

        function updateBadge(type) {
            const badge = elements.fileBadge;
            badge.textContent = type.toUpperCase();
            badge.className = 'file-badge ' + type;
        }

        // ============================================
        // DOWNLOAD & SHARE
        // ============================================
        function downloadFile(url, name) {
            if (!url) {
                showToast('No file URL available!', 'alert-circle');
                return;
            }
            try {
                const link = document.createElement('a');
                link.href = url;
                link.download = name || 'file';
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Download started!', 'download');
            } catch (e) {
                window.open(url, '_blank');
                showToast('Opening file...', 'external-link');
            }
        }

        function copyLink() {
            const params = getUrlParams();
            let url = '';
            if (currentFile.url) {
                url = currentFile.url;
            } else if (params.fileUrl) {
                url = params.fileUrl;
            } else if (params.channelId && params.messageId) {
                url = window.location.href;
            }
            if (!url) {
                showToast('No link to copy!', 'alert-circle');
                return;
            }
            navigator.clipboard.writeText(url).then(() => {
                showToast('Link copied to clipboard!', 'check-circle');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Link copied!', 'check-circle');
            });
        }

        function shareFile() {
            const url = window.location.href;
            if (!url) {
                showToast('No file to share!', 'alert-circle');
                return;
            }
            const shareData = {
                title: 'SK4Film - ' + (currentFile.name || 'File'),
                text: 'Check out this file on SK4Film!',
                url: url
            };
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            } else {
                copyLink();
            }
        }

        function openExternal() {
            const url = currentFile.url || getUrlParams().fileUrl;
            if (url) {
                window.open(url, '_blank');
            }
        }

        // ============================================
        // FILE SIZE FETCH
        // ============================================
        async function fetchFileSize(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                const size = response.headers.get('Content-Length');
                return size ? parseInt(size) : 0;
            } catch {
                return 0;
            }
        }

        // ============================================
        // SEARCH FILES VIA API
        // ============================================
        async function searchFiles(query) {
            if (!query || query.length < 2) {
                elements.searchResults.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`${CONFIG.apiUrl}/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    elements.searchResults.innerHTML = `
                        <div class="result-item text-center text-secondary">
                            <i data-feather="search" class="me-2"></i> No files found for "${query}"
                        </div>
                    `;
                    elements.searchResults.style.display = 'block';
                    feather.replace();
                    return;
                }

                let html = '';
                data.results.forEach((file, index) => {
                    const size = formatFileSize(file.file_size || 0);
                    const type = getFileType(getFileExtension(file.file_name, file.file_name));
                    html += `
                        <div class="result-item" onclick="loadFile('${file.chat_id}', '${file.message_id}', '${file.file_name}')">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="file-name">${file.file_name || 'Unknown'}</div>
                                    <div class="file-meta">📦 ${size} • 🆔 ${file.chat_id}</div>
                                </div>
                                <span class="file-badge ${type}">${type}</span>
                            </div>
                        </div>
                    `;
                });

                elements.searchResults.innerHTML = html;
                elements.searchResults.style.display = 'block';
                feather.replace();

            } catch (error) {
                console.error('Search error:', error);
                elements.searchResults.innerHTML = `
                    <div class="result-item text-center text-danger">
                        <i data-feather="alert-circle" class="me-2"></i> Search failed. Please try again.
                    </div>
                `;
                elements.searchResults.style.display = 'block';
                feather.replace();
            }
        }

        // ============================================
        // LOAD FILE FROM SEARCH RESULT
        // ============================================
        function loadFile(channelId, messageId, fileName) {
            const viewUrl = `${window.location.origin}${window.location.pathname}?channel_id=${channelId}&message_id=${messageId}&file_name=${encodeURIComponent(fileName)}`;
            window.location.href = viewUrl;
        }

        // ============================================
        // MAIN INITIALIZATION
        // ============================================
        async function init() {
            const params = getUrlParams();
            let fileUrl = params.fileUrl;

            // Support for channel_id & message_id - using Koyeb URL
            if (!fileUrl && params.channelId && params.messageId) {
                fileUrl = `${CONFIG.apiUrl}/stream/${params.channelId}/${params.messageId}`;
                currentFile.channelId = params.channelId;
                currentFile.messageId = params.messageId;
            }

            // Support for search query
            if (params.query) {
                elements.searchInput.value = params.query;
                await searchFiles(params.query);
            }

            // If no file URL and no channel/message, show search only
            if (!fileUrl && !params.channelId) {
                showLoading();
                elements.loading.innerHTML = `
                    <div style="text-align:center;">
                        <i data-feather="search" style="width:60px;height:60px;color:var(--primary-light);"></i>
                        <h5 class="mt-3">Search for files</h5>
                        <p class="text-secondary">Type in the search box above to find files</p>
                        <p class="text-secondary small">Using Koyeb: ${CONFIG.apiUrl}</p>
                    </div>
                `;
                feather.replace();
                return;
            }

            if (!fileUrl) {
                showError('No file URL or channel/message ID provided.');
                return;
            }

            showLoading();

            try {
                const ext = getFileExtension(fileUrl, params.fileName);
                const fileName = params.fileName || getFileNameFromUrl(fileUrl);
                const fileType = getFileType(ext);
                let fileSize = parseInt(params.fileSize) || 0;

                if (!fileSize && isValidUrl(fileUrl)) {
                    fileSize = await fetchFileSize(fileUrl);
                }

                currentFile = {
                    url: fileUrl,
                    name: fileName,
                    size: fileSize,
                    type: fileType,
                    extension: ext,
                    channelId: params.channelId || '',
                    messageId: params.messageId || ''
                };

                elements.fileName.textContent = fileName;
                elements.fileSize.textContent = formatFileSize(fileSize);
                updateBadge(fileType);

                const downloadButtons = [
                    elements.downloadBtn,
                    elements.downloadDocBtn,
                    elements.downloadUnsupportedBtn
                ];
                downloadButtons.forEach(btn => {
                    btn.dataset.url = fileUrl;
                    btn.dataset.name = fileName;
                });

                switch (fileType) {
                    case 'video': showVideoPlayer(fileUrl); break;
                    case 'audio': showAudioPlayer(fileUrl); break;
                    case 'image': showImagePlayer(fileUrl, fileName); break;
                    case 'document': showDocumentPlayer(fileName, fileSize); break;
                    default: showUnsupportedPlayer(fileName); break;
                }

                document.title = fileName + ' - SK4Film';
                showContent();
                feather.replace();

            } catch (error) {
                showError('Failed to load file: ' + error.message);
            }
        }

        // ============================================
        // SEARCH INPUT HANDLER
        // ============================================
        elements.searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            if (query.length < 2) {
                elements.searchResults.style.display = 'none';
                return;
            }
            searchTimeout = setTimeout(() => {
                searchFiles(query);
            }, 300);
        });

        elements.searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const query = this.value.trim();
                if (query.length >= 2) {
                    searchFiles(query);
                }
            }
        });

        // ============================================
        // EVENT LISTENERS
        // ============================================
        elements.downloadBtn.addEventListener('click', function() {
            downloadFile(this.dataset.url, this.dataset.name);
        });

        elements.downloadDocBtn.addEventListener('click', function() {
            downloadFile(this.dataset.url, this.dataset.name);
        });

        elements.downloadUnsupportedBtn.addEventListener('click', function() {
            downloadFile(this.dataset.url, this.dataset.name);
        });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'c') { copyLink(); }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                const url = elements.downloadBtn.dataset.url;
                const name = elements.downloadBtn.dataset.name;
                downloadFile(url, name);
            }
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                elements.searchInput.focus();
            }
        });

        document.addEventListener('click', function(e) {
            if (!elements.searchInput.contains(e.target) && !elements.searchResults.contains(e.target)) {
                elements.searchResults.style.display = 'none';
            }
        });

        // ============================================
        // AUTO-INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
