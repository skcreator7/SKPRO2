<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK4Film - File Search & Stream</title>
    <style>
        :root {
            --primary: #4f7cff;
            --primary-hover: #3f66db;
            --bg: #0f1115;
            --card-bg: #1a1d24;
            --border: #2a2d35;
            --text: #e8e8e8;
            --text-muted: #9aa0ab;
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --error: #ff6b6b;
            --success: #51cf66;
            --warning: #fcc419;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f7cff, #7c4fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Search Bar */
        .search-container {
            margin: 20px 0 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
        }

        .search-box input {
            flex: 1;
            padding: 14px 18px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box button {
            padding: 14px 28px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .search-box button:hover {
            background: var(--primary-hover);
        }

        .search-box button:active {
            transform: scale(0.97);
        }

        .search-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status */
        .status {
            text-align: center;
            padding: 10px;
            min-height: 40px;
            font-size: 0.95rem;
        }

        .status.idle {
            color: var(--text-muted);
        }

        .status.loading {
            color: var(--primary);
        }

        .status.success {
            color: var(--success);
        }

        .status.error {
            color: var(--error);
        }

        .status.warning {
            color: var(--warning);
        }

        /* Results */
        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 40px;
        }

        .result-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: border-color 0.2s, transform 0.2s;
            animation: slideIn 0.3s ease;
        }

        .result-item:hover {
            border-color: #3a3f4a;
            transform: translateY(-1px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-name {
            font-weight: 600;
            font-size: 1.05rem;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .file-meta {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .file-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .file-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .file-actions button,
        .file-actions a {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .file-actions button:hover,
        .file-actions a:hover {
            background: #2a2e38;
            border-color: #3a3f4a;
        }

        .file-actions .btn-play {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .file-actions .btn-play:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        /* Player */
        .player-wrapper {
            margin: 20px 0 30px;
            border-radius: var(--radius);
            overflow: hidden;
            background: #000;
            display: none;
            box-shadow: var(--shadow);
        }

        .player-wrapper.active {
            display: block;
        }

        .player-wrapper video {
            width: 100%;
            display: block;
            max-height: 70vh;
            background: #000;
        }

        .player-controls {
            padding: 12px 16px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
        }

        .player-controls .file-name-display {
            font-size: 0.9rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            margin-right: 12px;
        }

        .player-controls .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .player-controls .btn-close:hover {
            color: var(--error);
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .no-results .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }

        /* API Status */
        .api-status {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 8px;
            margin-top: 10px;
        }

        .api-status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .api-status .dot.online {
            background: var(--success);
        }

        .api-status .dot.offline {
            background: var(--error);
        }

        .api-status .dot.checking {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .logo {
                font-size: 1.8rem;
            }

            .search-box {
                flex-direction: column;
                background: transparent;
                border: none;
                padding: 0;
                gap: 8px;
            }

            .search-box input {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 14px;
            }

            .search-box button {
                width: 100%;
                justify-content: center;
                padding: 14px;
            }

            .file-name {
                font-size: 0.95rem;
            }

            .file-actions button,
            .file-actions a {
                padding: 6px 12px;
                font-size: 0.8rem;
            }

            .player-wrapper video {
                max-height: 50vh;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a3f4a;
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--card-bg) 25%, #252932 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius);
            height: 70px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">🎬 SK4Film</div>
            <p class="subtitle">Search &amp; stream your files instantly</p>
        </header>

        <!-- API Status -->
        <div class="api-status" id="apiStatus">
            <span class="dot checking" id="statusDot"></span>
            <span id="statusText">Connecting to API...</span>
        </div>

        <!-- Search -->
        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by file name..." 
                    autocomplete="off"
                    spellcheck="false"
                >
                <button id="searchBtn" onclick="performSearch()">🔍 Search</button>
            </div>
        </div>

        <!-- Status -->
        <div id="status" class="status idle">Enter a search term to find files</div>

        <!-- Player -->
        <div id="playerWrapper" class="player-wrapper">
            <video id="player" controls preload="metadata"></video>
            <div class="player-controls">
                <span class="file-name-display" id="playerFileName">Now playing</span>
                <button class="btn-close" onclick="closePlayer()" title="Close player">✕</button>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="results"></div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        // Use your actual Koyeb API URL
        const API_BASE = 'https://uninterested-drusie-tgbottest-65971677.koyeb.app';
        const SEARCH_ENDPOINT = API_BASE + '/api/search';
        const STREAM_BASE = API_BASE + '/stream';
        const HEALTH_ENDPOINT = API_BASE + '/health';

        console.log('🔗 API Base:', API_BASE);
        console.log('🔍 Search Endpoint:', SEARCH_ENDPOINT);
        console.log('📡 Stream Base:', STREAM_BASE);

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const statusEl = document.getElementById('status');
        const resultsEl = document.getElementById('results');
        const playerWrapper = document.getElementById('playerWrapper');
        const player = document.getElementById('player');
        const playerFileName = document.getElementById('playerFileName');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // ============================================
        // API HEALTH CHECK
        // ============================================
        async function checkAPI() {
            try {
                statusDot.className = 'dot checking';
                statusText.textContent = 'Checking API connection...';
                
                const response = await fetch(HEALTH_ENDPOINT, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('✅ API Health:', data);
                    statusDot.className = 'dot online';
                    const clientStatus = data.client || 'Unknown';
                    statusText.textContent = `API Online ✅ (Client: ${clientStatus})`;
                    return true;
                } else {
                    statusDot.className = 'dot offline';
                    statusText.textContent = `API Error (HTTP ${response.status}) ❌`;
                    console.error('❌ API Health check failed:', response.status);
                    return false;
                }
            } catch (error) {
                statusDot.className = 'dot offline';
                statusText.textContent = 'API Unreachable ❌ - Check if server is running';
                console.error('❌ Health check failed:', error);
                return false;
            }
        }

        // Check API status on load and periodically
        let apiOnline = false;
        checkAPI().then(status => {
            apiOnline = status;
            if (!apiOnline) {
                setStatus('⚠️ API is offline. Please check the server.', 'error');
            }
        });
        setInterval(async () => {
            apiOnline = await checkAPI();
        }, 30000);

        // ============================================
        // SEARCH FUNCTION
        // ============================================
        let searchTimeout = null;
        let isSearching = false;

        // Enter key support
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        // Auto-search with debounce
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            if (query.length >= 2) {
                searchTimeout = setTimeout(performSearch, 500);
            } else if (query.length === 0) {
                clearResults();
                setStatus('Enter a search term to find files', 'idle');
            }
        });

        async function performSearch() {
            const query = searchInput.value.trim();

            if (query.length < 2) {
                setStatus('Please enter at least 2 characters', 'idle');
                return;
            }

            if (isSearching) return;
            isSearching = true;
            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ Searching...';

            setStatus('Searching...', 'loading');
            clearResults();

            try {
                // Check if API is online first
                if (!apiOnline) {
                    const recheck = await checkAPI();
                    if (!recheck) {
                        throw new Error('API is offline. Please check the server.');
                    }
                    apiOnline = true;
                }

                const url = `${SEARCH_ENDPOINT}?q=${encodeURIComponent(query)}&limit=30`;
                console.log('🔍 Searching:', url);
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                console.log('📊 Response status:', response.status);

                if (!response.ok) {
                    let errorMsg = `HTTP ${response.status}`;
                    try {
                        const errorData = await response.json();
                        errorMsg = errorData.error || errorMsg;
                    } catch (e) {
                        errorMsg = await response.text() || errorMsg;
                    }
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                console.log('📊 Search results:', data);

                if (!data.results || data.results.length === 0) {
                    setStatus(`No files found for "${query}"`, 'idle');
                    showNoResults(query);
                    return;
                }

                setStatus(`Found ${data.total} result(s) for "${query}"`, 'success');
                renderResults(data.results);

            } catch (error) {
                console.error('❌ Search error:', error);
                setStatus(`Search failed: ${error.message}`, 'error');
                showError(error.message);
            } finally {
                isSearching = false;
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 Search';
            }
        }

        // ============================================
        // RENDER RESULTS
        // ============================================
        function renderResults(files) {
            resultsEl.innerHTML = '';

            files.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.style.animationDelay = `${index * 0.05}s`;

                const sizeMB = file.file_size ? (file.file_size / (1024 * 1024)).toFixed(1) : '0';
                const isVideo = (file.mime_type || '').startsWith('video/');
                const isAudio = (file.mime_type || '').startsWith('audio/');
                const isImage = (file.mime_type || '').startsWith('image/');

                let icon = '📄';
                if (isVideo) icon = '🎬';
                else if (isAudio) icon = '🎵';
                else if (isImage) icon = '🖼️';
                else if (file.mime_type?.includes('pdf')) icon = '📕';
                else if (file.mime_type?.includes('zip') || file.mime_type?.includes('rar')) icon = '📦';

                const streamUrl = file.stream_url || `${STREAM_BASE}/${file.chat_id}/${file.message_id}`;
                console.log(`🔗 Stream URL: ${streamUrl}`);

                let actionsHtml = '';
                if (isVideo) {
                    actionsHtml += `<button class="btn-play" onclick="playVideo('${streamUrl}', '${escapeHtml(file.file_name)}')">▶ Play</button>`;
                }
                if (isAudio) {
                    actionsHtml += `<button class="btn-play" onclick="playAudio('${streamUrl}', '${escapeHtml(file.file_name)}')">▶ Play</button>`;
                }
                actionsHtml += `<a href="${streamUrl}" target="_blank" rel="noopener">⬇ Download</a>`;
                actionsHtml += `<a href="${streamUrl}" target="_blank" rel="noopener">🔗 Open</a>`;

                item.innerHTML = `
                    <div class="file-name">
                        <span class="file-icon">${icon}</span>
                        <span>${escapeHtml(file.file_name)}</span>
                    </div>
                    <div class="file-meta">
                        <span>📏 ${sizeMB} MB</span>
                        <span>📁 ${escapeHtml(file.mime_type || 'Unknown')}</span>
                        <span>🆔 ${file.message_id}</span>
                    </div>
                    <div class="file-actions">${actionsHtml}</div>
                `;

                resultsEl.appendChild(item);
            });
        }

        // ============================================
        // PLAY VIDEO / AUDIO
        // ============================================
        function playVideo(url, fileName) {
            console.log(`▶️ Playing: ${fileName} from ${url}`);
            playerWrapper.classList.add('active');
            player.style.display = 'block';
            player.src = url;
            playerFileName.textContent = fileName || 'Now playing';
            player.scrollIntoView({ behavior: 'smooth', block: 'start' });
            player.load();
            player.play().catch(err => {
                console.warn('Auto-play prevented:', err);
                // Show play button overlay or message
            });
        }

        function playAudio(url, fileName) {
            playVideo(url, fileName);
        }

        // ============================================
        // CLOSE PLAYER
        // ============================================
        function closePlayer() {
            player.pause();
            player.src = '';
            player.load();
            playerWrapper.classList.remove('active');
            player.style.display = 'none';
            playerFileName.textContent = 'Now playing';
        }

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function setStatus(message, type = 'idle') {
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        function clearResults() {
            resultsEl.innerHTML = '';
        }

        function showNoResults(query) {
            resultsEl.innerHTML = `
                <div class="no-results">
                    <span class="emoji">🔍</span>
                    <p>No files found for "<strong>${escapeHtml(query)}</strong>"</p>
                    <p style="font-size: 0.85rem; margin-top: 6px;">Try a different search term</p>
                </div>
            `;
        }

        function showError(message) {
            resultsEl.innerHTML = `
                <div class="no-results">
                    <span class="emoji">⚠️</span>
                    <p>Error: <strong>${escapeHtml(message)}</strong></p>
                    <p style="font-size: 0.85rem; margin-top: 6px;">Please try again later</p>
                    <p style="font-size: 0.75rem; margin-top: 4px; color: var(--text-muted);">
                        API: ${API_BASE}
                    </p>
                </div>
            `;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', (e) => {
            // Ctrl+K or Cmd+K to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }

            // Escape to close player or clear search
            if (e.key === 'Escape') {
                if (playerWrapper.classList.contains('active')) {
                    closePlayer();
                } else {
                    searchInput.value = '';
                    searchInput.focus();
                    clearResults();
                    setStatus('Enter a search term to find files', 'idle');
                }
            }
        });

        // ============================================
        // AUTO-SEARCH FROM URL PARAMS
        // ============================================
        (function init() {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            if (q && q.trim().length >= 2) {
                searchInput.value = q.trim();
                // Wait for API to be ready
                setTimeout(() => {
                    performSearch();
                }, 1500);
            }
        })();

        console.log('🎬 SK4Film Player loaded!');
        console.log(`🔗 API Base: ${API_BASE}`);
        console.log('💡 Tip: Press Ctrl+K to focus search');
    </script>
</body>
</html>
